<!DOCTYPE html>
<html>

<head>
	<title>Coding from Life</title>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="base.css" type="text/css" />
	<style>
		.canvas {
			background: #d13b2c;
			position: relative;
		}
		.apple {
			height: 100px;
			width: 100px;
			background: #7a1a2cf7;
			border-radius: 45%;
			position: absolute;
			bottom: 95px;
			left: 225px;
			z-index: 1;
		}
		.vase {
			height: 300px;
			width: 200px;
			background: rgba(255, 255, 255, 0.5);
			position: absolute;
			bottom: 123px;
			left: 378px;
			border-right: 2px solid white;
			border-left: 3px solid white;
		}
		.vase-bottom {
			height: 85px;
			width: 100%;
			background: rgba(255, 255, 255, 0.5);
			position: absolute;
			bottom: -42px;
			border-radius: 50%;
			border-bottom: 2px solide white;
		}
		.vase-top {
			height: 85px;
			width: 100%;
			position: absolute;
			top: -44px;
			border-radius: 50%;
			border: 2px solid white
		}
		.flower {
			height: 400px;
			width: 50px;
			border: 1px solid lime;
			transform: rotate(-15deg);
			position: absolute;
			bottom: 0;
			right: 76px;
		}
		.flower-two {
			transform: rotate(25deg);
			right: 44px;
		}
		.stem {
			height: 100%;
			width: 10px;
			background: forestgreen;
		}
		.petals {
			height: 50px;
			width: 125px;
			background: yellow;
			border-radius: 50%;
			position: absolute;
			top: -34px;
			left: -56px;
		}
		.petal {
			background: yellow;
			height: 50px;
			width: 10px;
			border-radius: 50%;
			position: absolute;
			transform: rotate(-66deg);
			left: 34px;
			bottom: -12px;
		}
		.ruler {
			background: linear-gradient(90deg, rgba(184,) );
		}
		.plate {
			height: 68px;
			width: 183px;
			background: rgba(255, 255, 255, 0.5);
			border-radius: 50%;
			position: absolute;
		}
		.cake {
			width: 0;
			height: 0;
			border-top: 50px solid transparent;
			border-bottom: 50px solid transparent;
			border-left: 128 solid #954d11;
			transform: rotate(160def);
			position: absolute;
			bottom: 0;
			left: 18px;
		}
		.candle {
			background: white;
			height: 50px;
			width: 10px;
			position: absolute;
			bottom: 61px;
			right: 60px;
		}
		.flame {
			background: yellow;
			height: 30px;
			width: 16px;
			border-radius: 50%;
			position: absolute;
			bottom: 117px;
			right: 54px;
			animation: 0.75s linear 1s infinite alternate flicker;
		}
		@keyframes flicker{
			from {
				transform: rotate(0deg);
				opacity: 0.5;
			}
			to {
				transform: rotate(-25deg);
				opacity: 1;
			}
		}
	</style>
</head>

<body>

  <div class="canvas">
	<div class ="ruler"></div>
	<div class="apple"></div>
	<div class="vase">
		<div class="vase-bottom"></div>
		<div class="vase-top"></div>
		<div class="flower">
			<div class="stem"></div>
			<div class="petals">
				<div class="petals one"></div>
				<div class="petals two"></div>
				<div class="petals three"></div>
				<div class="petals four"></div>
				<div class="petals five"></div>
			</div>
		</div>
		<div class="flower-two">
			<div class="stem"></div>
			<div class="petals">
				<div class="petals one"></div>
				<div class="petals two"></div>
				<div class="petals three"></div>
				<div class="petals four"></div>
				<div class="petals five"></div>
			</div>
		</div>
		<div class="ruler"></div>
		<div class="cake"></div>
		<div class="candle"></div>
		<div class="flame"></div>

	</div>
  </div>

</body>

</html>
